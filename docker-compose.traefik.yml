# Komplett docker-compose.yml for n8n-compose med workout-assistant
# Kopier dette til ~/n8n-compose/docker-compose.yml på serveren

services:
  traefik:
    image: "traefik"
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy]

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    command: ["start"]
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks: [proxy]

  mcas-app:
    image: mcas-search-compose-mcas-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - mcas_data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.mcas.rule=Host(`mcas-search.greger.cc`)
      - traefik.http.routers.mcas.entrypoints=web,websecure
      - traefik.http.routers.mcas.tls=true
      - traefik.http.routers.mcas.tls.certresolver=mytlschallenge
      - traefik.http.services.mcas.loadbalancer.server.port=3000
      - traefik.http.routers.mcas.service=mcas
    networks: [proxy]

  # ==================== WORKOUT ASSISTANT ====================
  workout-assistant:
    image: workout-assistant:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      # Sørg for at denne filen eksisterer: /home/janog/workout-assistant/.env
      - /home/janog/workout-assistant/.env
    labels:
      - traefik.enable=true

      # Frontend routing (port 3000)
      - traefik.http.routers.workout-frontend.rule=Host(`workout.greger.cc`)
      - traefik.http.routers.workout-frontend.entrypoints=web,websecure
      - traefik.http.routers.workout-frontend.tls=true
      - traefik.http.routers.workout-frontend.tls.certresolver=mytlschallenge
      - traefik.http.services.workout-frontend.loadbalancer.server.port=3000
      - traefik.http.routers.workout-frontend.service=workout-frontend

      # Backend API routing (port 3001)
      - traefik.http.routers.workout-backend.rule=Host(`workout-api.greger.cc`)
      - traefik.http.routers.workout-backend.entrypoints=web,websecure
      - traefik.http.routers.workout-backend.tls=true
      - traefik.http.routers.workout-backend.tls.certresolver=mytlschallenge
      - traefik.http.services.workout-backend.loadbalancer.server.port=3001
      - traefik.http.routers.workout-backend.service=workout-backend
    networks: [proxy]


volumes:
  n8n_data:
  traefik_data:
  mcas_data:

networks:
  proxy:
