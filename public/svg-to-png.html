<!DOCTYPE html>
<html>
<head>
    <title>SVG to PNG Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
        button {
            background: #3b82f6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>Ikoner genereres automatisk fra SVG og lastes ned.</p>

    <div>
        <h2>192x192</h2>
        <canvas id="canvas192" width="192" height="192"></canvas>
        <br>
        <button onclick="downloadIcon(192)">Last ned icon-192.png</button>
    </div>

    <div>
        <h2>512x512</h2>
        <canvas id="canvas512" width="512" height="512"></canvas>
        <br>
        <button onclick="downloadIcon(512)">Last ned icon-512.png</button>
    </div>

    <script>
        const svgContent = `<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e5ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e5ec;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#e0e5ec" rx="110"/>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="12" dy="12" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="highlight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="-12" dy="-12" result="offsetblur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.7"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="106" y="106" width="300" height="300" rx="60" fill="#e0e5ec" filter="url(#shadow)"/>
  <rect x="106" y="106" width="300" height="300" rx="60" fill="#e0e5ec" filter="url(#highlight)"/>
  <g transform="translate(256, 256)" fill="none" stroke="#0ea5e9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -60 -48 L -60 48" stroke-width="20"/>
    <path d="M -80 -48 L -40 -48"/>
    <path d="M -80 48 L -40 48"/>
    <path d="M -80 -32 L -80 32"/>
    <path d="M -40 -32 L -40 32"/>
    <path d="M -40 0 L 40 0" stroke-width="12"/>
    <path d="M 60 -48 L 60 48" stroke-width="20"/>
    <path d="M 40 -48 L 80 -48"/>
    <path d="M 40 48 L 80 48"/>
    <path d="M 40 -32 L 40 32"/>
    <path d="M 80 -32 L 80 32"/>
  </g>
</svg>`;

        function drawIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            const ctx = canvas.getContext('2d');
            const img = new Image();

            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);

            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
                URL.revokeObjectURL(url);
            };

            img.src = url;
        }

        function downloadIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Draw icons on load
        window.onload = function() {
            drawIcon(192);
            drawIcon(512);
        };
    </script>
</body>
</html>
